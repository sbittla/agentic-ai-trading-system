# Agentic AI Trading System runtime (see docs/ARCHITECTURE.md §1)
#   Start:           docker compose -f docker/docker-compose.yml up -d
#   Replay a day:    docker compose -f docker/docker-compose.yml --profile replay run --rm replay replay --day 2026-10-15
#   Price alerts only (light: no Postgres/Ollama/GPU), see docs/ALERTS.md:
#                    docker compose -f docker/docker-compose.yml --profile alerts up -d alerts
#   Dashboards:      docker compose -f docker/docker-compose.yml --profile monitoring up -d grafana grafana-proxy
#                    then http://localhost:3000 (admin / secrets/grafana_admin_password.txt)
# Pin every image to a version tag or digest before paper trading (SEC-10).

name: agentic-ai-trading-system

x-app: &app
  build:
    context: ..
    dockerfile: docker/Dockerfile
  restart: unless-stopped
  read_only: true                       # containers cannot modify their own filesystem
  tmpfs: [/tmp]
  security_opt: ["no-new-privileges:true"]
  environment:
    TZ: America/New_York
    TRADER_CONFIG: /app/config/config.yaml
    DB_ROLE_PREFIX: ${DB_ROLE_PREFIX:-}   # role names for `trader migrate` grants
    # numpy/torch default to one thread per CPU (24 here): cap them so the Python services
    # do not compete with each other and Ollama, and BLAS buffers stay small (no page file)
    OMP_NUM_THREADS: "4"
    OPENBLAS_NUM_THREADS: "4"
    MKL_NUM_THREADS: "4"
  volumes:
    - ../config:/app/config:ro          # config is read-only everywhere (DV-3)

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:                        # names from docker/.env (git-ignored); see docker/.env.example
      POSTGRES_DB: ${PG_DATABASE:-trader}
      POSTGRES_USER: ${PG_ADMIN_USER:-trader_admin}
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_admin_password
      DB_ROLE_PREFIX: ${DB_ROLE_PREFIX:-}
    secrets: [pg_admin_password, pg_core_password, pg_news_password, pg_notifier_password,
              pg_readonly_password]
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
      - ./postgres/init.sql:/init/init.sql:ro
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest         # pin before paper trading
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    networks: [internal]                # SEC-9: no host port
    gpus: all                           # NVIDIA GPU via Docker Desktop + WSL2 (RUNBOOK §1 step 1)
    environment:                        # sized for an 8 GB GPU (RTX 4060 Laptop) with qwen3:8b
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      OLLAMA_KEEP_ALIVE: 8h             # QW-4: stay loaded through the trading day
      OLLAMA_MAX_LOADED_MODELS: "1"     # one model in VRAM at a time
      OLLAMA_NUM_PARALLEL: "1"          # agents call Qwen one at a time; saves KV-cache VRAM
      OLLAMA_FLASH_ATTENTION: "1"       # lower VRAM use for the 8K context
      OLLAMA_KV_CACHE_TYPE: q8_0        # halves KV-cache VRAM; needs flash attention
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3

  model-pull:                           # one-off model download (RUNBOOK §1 step 6):
    image: ollama/ollama:latest         #   docker compose -f docker/docker-compose.yml --profile setup run --rm model-pull
    profiles: [setup]                   # the runtime `ollama` stays on the internal network (SEC-9)
    restart: "no"
    entrypoint: ["/bin/sh", "-c", "ollama serve >/dev/null 2>&1 & sleep 5 && ollama pull $${OLLAMA_MODEL:-qwen3:8b}"]
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
      OLLAMA_MAX_TRANSFER_STREAMS: "2"  # gentler download; 4 parallel streams crashed Docker Desktop's WSL engine
    volumes:
      - ollama-models:/root/.ollama
    networks: [egress]

  trader-core:
    <<: *app
    build: {context: .., dockerfile: docker/Dockerfile, target: core}
    command: ["trader", "run", "--service", "core"]
    env_file: [../.env.core]            # Alpaca keys + core DB password only
    # env_file: [../.env.core, ../.env.live]   # SEC-7: add only at go-live
    volumes:
      - ../config:/app/config:ro
      - bars:/app/data/bars
      - ../reports:/app/reports             # A11 report files
      - ../recordings:/app/recordings       # recorded days for the replay library (RP-1)
    depends_on:
      postgres: {condition: service_healthy}
      ollama: {condition: service_healthy}
    networks: [internal, egress]
    healthcheck:
      test: ["CMD", "trader", "health", "--service", "core"]
      interval: 30s
      timeout: 10s
      retries: 3

  news-sentiment:
    <<: *app
    build: {context: .., dockerfile: docker/Dockerfile, target: news}
    command: ["trader", "run", "--service", "news"]
    env_file: [../.env.news]            # Finnhub, Reddit, EDGAR user agent, news DB password
    volumes:
      - ../config:/app/config:ro
      - hf-cache:/app/.cache/huggingface   # FinBERT weights (downloaded once)
    tmpfs: [/tmp]
    read_only: false                    # model cache writes; still no-new-privileges
    depends_on:
      postgres: {condition: service_healthy}
      ollama: {condition: service_healthy}
    networks: [internal, egress]
    healthcheck:
      test: ["CMD", "trader", "health", "--service", "news"]
      interval: 60s
      timeout: 10s
      retries: 3

  notifier:
    <<: *app
    build: {context: .., dockerfile: docker/Dockerfile, target: notifier}
    command: ["trader", "run", "--service", "notifier"]
    env_file: [../.env.notifier]        # Twilio keys, allowed senders, notifier DB password
    depends_on:
      postgres: {condition: service_healthy}
    networks: [internal, egress]
    healthcheck:
      test: ["CMD", "trader", "health", "--service", "notifier"]
      interval: 30s
      timeout: 10s
      retries: 3

  alerts:                               # standalone Telegram price alerts (docs/ALERTS.md)
    <<: *app
    build: {context: .., dockerfile: docker/Dockerfile, target: alerts}
    profiles: [alerts]
    command: ["trader", "alerts"]
    env_file: [../.env.alerts]          # Alpaca data keys + Telegram bot token/chat id only
    environment:
      TZ: America/New_York
      ALERTS_CONFIG: /app/config/alerts.yaml   # optional; built-in defaults if missing
      ALERTS_DB: /app/data/alerts.sqlite
      LOG_LEVEL: ${ALERTS_LOG_LEVEL:-INFO}
    volumes:
      - ../config:/app/config:ro
      - alerts-data:/app/data           # rules, watchlist and alert log survive restarts
    mem_limit: 160m                     # uses ~40-60 MB; the cap guards the host
    cpus: 0.5
    networks: [egress]                  # outbound only: Alpaca + Telegram, no ports
    healthcheck:
      test: ["CMD", "trader", "health", "--service", "alerts"]
      interval: 60s
      timeout: 15s
      retries: 3

  backup:
    <<: *app
    build: {context: .., dockerfile: docker/Dockerfile, target: tools}
    command: ["trader", "backup", "--daily-at", "18:00"]
    env_file: [../.env.backup]          # read-only DB role
    volumes:
      - ../config:/app/config:ro
      - bars:/app/data/bars:ro
      - ${BACKUP_PATH:-../backups}:/backups
    depends_on:
      postgres: {condition: service_healthy}
    networks: [internal]

  replay:
    <<: *app
    build: {context: .., dockerfile: docker/Dockerfile, target: core}
    profiles: [replay]
    restart: "no"
    entrypoint: ["trader"]
    env_file: [../.env.replay]          # no broker keys: SimBroker only
    volumes:
      - ../config:/app/config:ro
      - bars:/app/data/bars:ro
      - ../runs:/app/runs
      - ../recordings:/app/recordings:ro
    networks: [internal]                # no internet: replays are offline

  dev:                                  # used by the VS Code dev container (tools/devcontainer.json)
    build: {context: .., dockerfile: docker/Dockerfile, target: dev}
    profiles: [dev]
    command: ["sleep", "infinity"]
    env_file: [../.env.replay]          # no live or paper broker keys in development by default
    environment:
      TZ: America/New_York
    volumes:
      - ..:/workspace
    networks: [internal, egress]

  grafana:                              # browser dashboards (docs/MONITORING.md §3)
    image: grafana/grafana:13.2.3
    profiles: [monitoring]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    environment:
      TZ: America/New_York
      PG_DATABASE: ${PG_DATABASE:-trader}
      PG_READONLY_USER: ${DB_ROLE_PREFIX:-}readonly   # SELECT-only role (SEC-17)
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"        # no internet; use the bundled plugins
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/trader-today.json
    secrets: [pg_readonly_password, grafana_admin_password]
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [internal]                # no internet; reached through grafana-proxy
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q '\"database\": *\"ok\"'"]
      interval: 30s
      timeout: 5s
      retries: 3

  grafana-proxy:                        # publishes Grafana on the host; forwards only
    image: nginx:1.30.5-alpine
    profiles: [monitoring]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    ports: ["127.0.0.1:3000:3000"]      # localhost only
    volumes:
      - ./grafana/proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    networks: [internal, monitoring]
    depends_on:
      grafana: {condition: service_healthy}

networks:
  internal:
    internal: true                      # no internet access
  egress: {}                            # outbound internet for core, news, notifier
  monitoring: {}                        # host port for grafana-proxy (an internal network cannot publish)

volumes:
  pg-data: {}
  ollama-models: {}
  bars: {}
  hf-cache: {}
  grafana-data: {}
  alerts-data: {}

secrets:                                # git-ignored files, one password per line
  pg_admin_password:
    file: ../secrets/pg_admin_password.txt
  pg_core_password:
    file: ../secrets/pg_core_password.txt
  pg_news_password:
    file: ../secrets/pg_news_password.txt
  pg_notifier_password:
    file: ../secrets/pg_notifier_password.txt
  pg_readonly_password:
    file: ../secrets/pg_readonly_password.txt
  grafana_admin_password:
    file: ../secrets/grafana_admin_password.txt
