[project]
name = "agentic-ai-trading-system"
version = "0.1.0"
description = "Disciplined agent-based day and swing trading for a fixed list of 10 large-cap US stocks"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alpaca-py>=0.30",          # broker + market data (pin exact versions in requirements/*.lock)
  "httpx>=0.27",              # Ollama, Finnhub, EDGAR
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",     # Postgres driver (journal + outbox bus)
  "pandas>=2.2",
  "pyarrow>=16.0",
  "numpy>=1.26",
  "exchange-calendars>=4.5",  # NYSE sessions, half days, holidays (cross-checked with Alpaca)
  "structlog>=24.1",
  "tzdata>=2024.1",           # IANA zones on Windows hosts
]

[project.optional-dependencies]
news = ["praw>=7.7", "transformers>=4.44", "torch>=2.3"]   # news-sentiment image only (FinBERT)
notifier = ["twilio>=9.0"]                                  # notifier image only
console = ["starlette>=0.40", "uvicorn>=0.30", "python-multipart>=0.0.9"]  # console image only
dev = ["pytest>=8", "pytest-asyncio>=0.23", "hypothesis>=6", "ruff>=0.5", "mypy>=1.10",
       "pip-tools>=7.4", "types-PyYAML", "pandas-stubs"]

[project.scripts]
trader = "trader.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trader = ["prompts/*/*.md", "console/static/*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]   # S = bandit security rules

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]
"src/trader/backtest/synthetic.py" = ["S311"]

[tool.mypy]
strict = true
packages = ["trader"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["alpaca.*", "exchange_calendars.*", "praw.*", "twilio.*", "transformers.*", "pyarrow.*",
          "psycopg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "rule(id): requirement ID covered by this test (see docs/TRACEABILITY.md)",
  "integration: needs Docker (Postgres) or network; skipped when unavailable",
]
