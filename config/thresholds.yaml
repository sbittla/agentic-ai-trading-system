# Threshold registry (CA-1, docs/EDGE_PORTFOLIO_REQUIREMENTS.md §5).
#
# Every numeric threshold of a planned requirement, with its status:
#   policy      the owner's preference: decided, not calibrated (loss limits, risk, attention)
#   initial     a reasonable starting value, to be calibrated on in-sample or paper data (CA-2),
#               never on the frozen holdout (RL-5), and checked at -25%/+25% (CA-3)
#   calibrated  changed or confirmed with evidence (cite the report)
# Seeded October 17, 2026 from the CA-5 table. Code wiring (reading these instead of literals)
# and the test that every requirement's threshold is listed are backlog B02. Thresholds of
# built features stay in config.py and are added here as B02 migrates them.

