# Recurring company events for the event study (docs/EVENT_REQUIREMENTS.md, EV-1).
#
# Each group is one kind of event for one ticker. A date is the keynote or start day:
#   "2025-06-09"        the event starts during market hours (or before the open): that
#                       session is the reaction day
#   "2025-09-17 amc"    the event starts after the 16:00 ET close (or on a weekend/holiday):
#                       the next session is the reaction day
# `upcoming` lists future dates; `estimated: true` marks a date guessed from the usual
# pattern, not announced. Dates were collected by hand: verify before trading on one, and add
# the new year's date when the company announces it. A group's `family` pools similar events
# (all of one CEO's keynotes, say) when the group alone has too few years.

# Earnings dates for runs without the journal (EV-10). trader-core uses Finnhub's calendar
# (fresh daily, 60 days ahead) instead; these only fill in for a host CLI run. A buy idea whose
# window holds an earnings report is blocked: no past window held one.
earnings:
  NVDA: [2026-11-17]          # Finnhub calendar as of 2026-10-16

